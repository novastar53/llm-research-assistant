[project]
name = "llm-scientist"
version = "0.1.0"
description = "Git-native, registry-free research experiment explorer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2.7",
    "uvicorn>=0.54.0",
]

[project.scripts]
scientist = "scientist.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scientist"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The spec is an external contract document; never rewrite its code blocks.
extend-exclude = ["llm_scientist_mvp_spec.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
